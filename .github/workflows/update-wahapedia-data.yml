name: Sync Wahapedia data

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run update:data

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Sync Wahapedia data
          title: Sync Wahapedia data
          body: Automated update from the scheduled Wahapedia sync job.
          branch: sync-wahapedia-data
          delete-branch: true
