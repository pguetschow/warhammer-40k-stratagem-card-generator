name: Validate Wahapedia 11 integration

on:
  push:
    branches:
      - wahapedia-11th-edition

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate 11th Edition data
        run: npm run update:data -- --edition=11

      - name: Build application
        run: npm run build

      - name: Commit generated data
        run: |
          git config user.name "Paul Fink"
          git config user.email "15265066+pguetschow@users.noreply.github.com"
          git add -- public/data/11/cards.json public/data/editions.json
          if git diff --cached --quiet; then
            echo "No generated data changes"
            exit 0
          fi
          git commit -m "Sync Wahapedia 11th Edition data"
          git push
