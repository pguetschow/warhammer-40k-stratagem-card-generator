name: Temporary Wahapedia raw snapshot

on:
  push:
    branches:
      - wahapedia-11th-edition
    paths:
      - .github/workflows/snapshot-wahapedia-raw.yml

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download raw Wahapedia exports
        run: |
          set -u
          UA="Mozilla/5.0 (X11; Linux x86_64) stratagem-card-generator"
          for ed in wh40k10ed wh40k11ed; do
            out=".wahapedia-snapshot/$ed"
            mkdir -p "$out"
            curl -sSL -A "$UA" -o "$out/data-export.html" -w "$ed page %{http_code}\n" "https://wahapedia.ru/$ed/the-rules/data-export/" || true
            curl -sSL -A "$UA" -o "$out/spec.xlsx" -w "$ed spec %{http_code}\n" "https://wahapedia.ru/$ed/Export%20Data%20Specs.xlsx" || true
            if unzip -l "$out/spec.xlsx" >/dev/null 2>&1; then
              unzip -p "$out/spec.xlsx" xl/worksheets/_rels/sheet1.xml.rels > "$out/spec-rels.xml" || true
            fi
            grep -o 'https\?://[^"]*\.\(csv\|xlsx\)' "$out/data-export.html" | sort -u > "$out/page-links.txt" || true
            for name in Factions Source Stratagems Detachments Detachment_abilities Enhancements Last_update; do
              curl -sSL -A "$UA" -o "$out/$name.csv" -w "$ed $name %{http_code} %{size_download}\n" "https://wahapedia.ru/$ed/$name.csv" || true
            done
          done
          ls -laR .wahapedia-snapshot

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .wahapedia-snapshot
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Add temporary raw Wahapedia snapshot"
          git push
